<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Automated Grading System for Handwritten Objective Examinations - web-based prototype with answer key management, results review, and Excel export.">
  <title>Automated Grading System</title>
  <link rel="stylesheet" href="css/styles.css?v=frontend-complete">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
</head>
<body>
  <div id="app-root">
    <div id="auth-setup" class="auth-view"></div>
    <div id="auth-login" class="auth-view"></div>
    <div id="auth-forgot" class="auth-view"></div>

    <div id="shell">
      <nav id="sidebar" aria-label="Primary navigation">
        <div class="sidebar-title">Automated
Grading System</div>
        <div class="sidebar-subtitle">Handwritten Objective Exams</div>
        <div class="sidebar-nav">
          <button class="sidebar-btn" data-page="dashboard" title="View overall grading statistics and recent system activity.">&#9638;&nbsp; Dashboard</button>
          <button class="sidebar-btn" data-page="answer_key" title="Create, edit, save, and delete answer keys.">&#9635;&nbsp; Answer Keys</button>
          <button class="sidebar-btn" data-page="upload" title="Upload scanned or captured answer sheet images.">&#8679;&nbsp; Upload Sheets</button>
          <button class="sidebar-btn" data-page="processing" title="Start placeholder processing and create model-ready records.">&#9881;&nbsp; Processing</button>
          <button class="sidebar-btn" data-page="results" title="View grading session summaries and student scores.">&#9745;&nbsp; Results</button>
          <button class="sidebar-btn" data-page="student_result" title="View item-level results for a selected student.">&#9707;&nbsp; Student Result</button>
          <button class="sidebar-btn" data-page="review" title="Manually check flagged answers that need teacher review.">&#9873;&nbsp; Review Flagged</button>
          <button class="sidebar-btn" data-page="reports" title="Export grading sessions.">&#9636;&nbsp; Reports</button>
          <button class="sidebar-btn" data-page="how_to_use" title="Open the step-by-step guide for using the system.">?&nbsp; How to Use</button>
          <button class="sidebar-btn" data-page="settings" title="Change account, export, template, and display settings.">&#9881;&nbsp; Settings</button>
        </div>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-user" id="sidebar-user">Teacher: Not signed in</div>
        <button class="logout-btn" id="logout-btn" title="Sign out and return to the login page.">&#8617;&nbsp; Logout</button>
      </nav>

      <div id="content-root">
        <div id="top-bar">
          <button type="button" id="mobile-menu-btn" class="mobile-menu-btn" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">&#9776;</button>
          <span class="top-title">Automated Grading System</span>
          <div class="top-spacer"></div>
          <input type="text" class="top-search" id="top-search"
                 placeholder="Search student, section, answer key..."
                 title="Search grading results by student name, section, or answer key.">
          <span class="top-teacher" id="top-teacher">Teacher: Not signed in</span>
        </div>

        <main id="pages-container">
          <div class="page" id="page-dashboard"></div>
          <div class="page" id="page-answer_key"></div>
          <div class="page" id="page-upload"></div>
          <div class="page" id="page-processing"></div>
          <div class="page" id="page-results"></div>
          <div class="page" id="page-student_result"></div>
          <div class="page" id="page-review"></div>
          <div class="page" id="page-reports"></div>
          <div class="page" id="page-how_to_use"></div>
          <div class="page" id="page-settings"></div>
        </main>
      </div>
    </div>
  </div>

  <script src="js/database.js?v=frontend-complete"></script>
  <script src="js/auth.js?v=frontend-complete"></script>
  <script src="js/dashboard.js?v=frontend-complete"></script>
  <script src="js/answer_key.js?v=frontend-complete"></script>
  <script src="js/upload.js?v=frontend-complete"></script>
  <script src="js/processing.js?v=frontend-complete"></script>
  <script src="js/results.js?v=frontend-complete"></script>
  <script src="js/student_result.js?v=frontend-complete"></script>
  <script src="js/review.js?v=frontend-complete"></script>
  <script src="js/reports.js?v=frontend-complete"></script>
  <script src="js/how_to_use.js?v=frontend-complete"></script>
  <script src="js/settings.js?v=frontend-complete"></script>
  <script src="js/debug.js?v=frontend-complete"></script>
  <script src="js/app.js?v=frontend-complete"></script>
</body>
</html>
