<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Automated Grading System for Handwritten Objective Examinations - web-based prototype with answer key management, results review, and Excel export.">
  <title>Automated Grading System</title>
  <!--
    SheetJS (Excel export) is NOT loaded here: as a plain script tag it is a 288 KB render-blocking
    request that delayed the first paint by ~2.7 s (Lighthouse). services/export.js loads it from its
    CDN the first time someone exports, with the same integrity hash. It is a CDN script rather than
    an npm import because the maintainers no longer publish `xlsx` to the public npm registry.
  -->
  <!--
    Same URL as the @import in src/assets/styles.css (which is kept identical to the original
    css/styles.css, so it stays). Linking it here lets the browser start the font request in parallel
    with the main stylesheet instead of only after that CSS has downloaded and been parsed; the
    @import is then answered from the same request.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
  <style>
    /*
      styles.css sets `html, body { height: 100% }` and `#app-root { height: 100% }`.
      Vue mounts into this extra #app element between them, so without a height
      here the chain breaks and the shell collapses to its content height.
      Kept in this file so src/assets/styles.css stays identical to ../css/styles.css.
    */
    #app { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
